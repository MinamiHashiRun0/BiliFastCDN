<!doctype html>
<meta charset="utf-8">
<title>running</title>
<pre id="report">running…</pre>
<script>
function fail(reason) {
  document.title = "ERROR";
  const el = document.getElementById("report");
  el.textContent = el.textContent + "\n\n!! THREW\n\n" + reason;
}
window.addEventListener("error", (e) => fail((e.error && e.error.stack) || e.message));
window.addEventListener("unhandledrejection", (e) => fail((e.reason && e.reason.stack) || String(e.reason)));
</script>
<script>
/*
 * Offline verification for the three scripts and the two modules.
 *
 *   bili-cdn.js        request-side rewriting (port of Redirect's Request.mjs)
 *   bili-playurl.js    response-side rewriting of playurl (JSON + gRPC)
 *   bili-speedtest.js  shared probe / ranking / panel
 *
 *   BiliFastCDN.sgmodule          request-side module
 *   BiliFastCDN.PlayURL.sgmodule  response-side module
 *
 * chrome --headless=new --disable-gpu --allow-file-access-from-files \
 *        --virtual-time-budget=20000 --dump-dom test/verify.html
 */

(async function () {
  "use strict";

  const lines = [];
  let pass = 0;
  const failures = [];

  function check(name, actual, expected) {
    const a = JSON.stringify(actual);
    const e = JSON.stringify(expected);
    if (a === e) { pass += 1; return; }
    failures.push(name + "\n     expected " + e + "\n     actual   " + a);
  }
  function checkTrue(name, actual) { check(name, !!actual, true); }
  function note(text) { lines.push("   " + text); }
  function render(final) {
    const total = pass + failures.length;
    const head = final
      ? (pass === total ? "ALL " + total + " CHECKS PASSED" : (total - pass) + " OF " + total + " CHECKS FAILED")
      : "progress: " + pass + " passed, " + failures.length + " failed";
    document.querySelector("#report").textContent = head + "\n" + lines.join("\n") +
      (failures.length ? "\n\nFAILURES\n\n" + failures.map((f) => "  " + f).join("\n\n") : "");
  }
  function section(title) { lines.push(""); lines.push("── " + title); render(false); }

  const clock = { now: 1700000000000 };
  Date.now = () => clock.now;

  const readText = async (url) => {
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.text();
  };

  const SRC_REQUEST = await readText("../bili-cdn.js");
  const SRC_PLAYURL = await readText("../bili-playurl.js");
  const SRC_PROBE = await readText("../bili-speedtest.js");
  const MOD_REQUEST = await readText("../BiliFastCDN.sgmodule");
  const MOD_PLAYURL = await readText("../BiliFastCDN.PlayURL.sgmodule");

  function apiOf(src) {
    window.module = { exports: {} };
    window.eval(src);
    return window.module.exports;
  }
  const req = apiOf(SRC_REQUEST);
  const pl = apiOf(SRC_PLAYURL);
  const probe = apiOf(SRC_PROBE);
  const VERSION = req.VERSION;

  const K_RANK = req.K_RANK;
  const K_STATS = probe.K_STATS;
  const K_SAMPLE = probe.K_SAMPLE;
  const RANK_A = "upos-tf-all-hw.bilivideo.com";
  const rankStore = (hosts, extra) => ({
    [K_RANK]: JSON.stringify(Object.assign({ at: clock.now, via: "sample", ranking: hosts, samples: [] }, extra || {}))
  });

  // Runs one script the way Surge would.
  function runSurge(src, globals) {
    return new Promise((resolve, reject) => {
      const store = Object.assign({}, globals.store || {});
      const run = { store, logs: [], notifications: [], httpCalls: [], donePayload: null, doneCount: 0 };
      window.$persistentStore = {
        read: (k) => (Object.prototype.hasOwnProperty.call(store, k) ? store[k] : null),
        write: (v, k) => { store[k] = String(v); return true; }
      };
      window.$notification = { post: (...a) => run.notifications.push(a) };
      window.$httpClient = {
        get: (opts, cb) => {
          run.httpCalls.push(opts);
          const spec = globals.http ? globals.http(opts) : { status: 500, data: "" };
          const delay = spec.delay || 0;
          setTimeout(() => {
            clock.now += delay;
            if (spec.error) cb(new Error("stub error"), null, null);
            else cb(null, { status: spec.status, headers: spec.headers || {} }, spec.data);
          }, 0);
        }
      };
      window.$done = (payload) => {
        run.doneCount += 1;
        run.donePayload = payload === undefined ? null : payload;
        resolve(run);
      };
      window.$argument = globals.argument;
      window.console.log = (m) => run.logs.push(String(m));
      ["$request", "$response", "$input", "$trigger", "$utils"].forEach((k) => {
        const name = k.slice(1);
        if (globals[name] !== undefined) window[k] = globals[name];
        else delete window[k];
      });
      try { window.eval(src); } catch (e) { reject(e); return; }
      setTimeout(() => resolve(run), 1500);
    });
  }

  const asRequest = (url, argument, store) => runSurge(SRC_REQUEST,
    { request: { url, method: "GET" }, argument, store });
  const asResponse = (url, body, argument, store, headers, utils) => runSurge(SRC_PLAYURL,
    { request: { url, method: "POST" }, response: { status: 200, headers: headers || {}, body },
      argument, store, utils });
  const asPanel = (argument, store, trigger, http) => runSurge(SRC_PROBE,
    { input: { purpose: "panel", panelName: "BiliFastCDN" }, argument, store, trigger, http });

  // 测速轮的假网络：公开接口给一个样本，候选主机各自回一段 256KB 的"视频"。
  const anyProbe = (opts) => {
    if (opts.url.indexOf("/x/web-interface/popular") !== -1) {
      return { status: 200, data: JSON.stringify({ data: { list: [{ bvid: "BV1abc", cid: 99 }] } }) };
    }
    if (opts.url.indexOf("/x/player/playurl") !== -1) {
      return { status: 200, data: JSON.stringify({ data: { dash: { video: [{ baseUrl: "https://upos-sz-mirrorcos.bilivideo.com/upgcxcode/1/2/3.m4s?deadline=1" }] } } }) };
    }
    return { status: 200, delay: 20, data: "x".repeat(262144) };
  };

  const hostOf = (url) => (req.parseUrl(url) || {}).host;
  const portOf = (url) => (req.parseUrl(url) || {}).port;

  // ---- 1. url primitives --------------------------------------------------

  section("url primitives");
  {
    const p = req.parseUrl("http://a.b.c:4483/upgcxcode/1.m4s?os=mcdn&x=1");
    check("scheme", p.scheme, "http");
    check("host", p.host, "a.b.c");
    check("port", p.port, "4483");
    check("path", p.path, "/upgcxcode/1.m4s");
    check("query", p.query, "?os=mcdn&x=1");
    check("garbage", req.parseUrl("not a url"), null);
    check("buildUrl without port", req.buildUrl("https", "h", "", "/p", "?q=1"), "https://h/p?q=1");
    check("queryParam decodes", req.queryParam("?a=1&xy_usource=upos-sz-mirrorhw.bilivideo.com", "xy_usource"),
      "upos-sz-mirrorhw.bilivideo.com");
    check("queryParam percent-decoding", req.queryParam("?url=a%2Fb%3Fc%3D1", "url"), "a/b?c=1");
  }

  // ---- 2. auto resolution -------------------------------------------------

  section("auto resolution");
  {
    const cfgAuto = req.loadConfig();
    check("the three categories default to auto", [cfgAuto.hostOverseaVideo, cfgAuto.hostBStar, cfgAuto.hostPcdn],
      [req.DEFAULTS.hostOverseaVideo, req.DEFAULTS.hostBStar, req.DEFAULTS.hostPcdn]);
    check("the mcdn target stays a fixed host", cfgAuto.hostMcdn, "proxy-tf-all-ws.bilivideo.com");

    window.$argument = "hostOverseaVideo=upos-sz-mirrorhw.bilivideo.com";
    check("a fixed host wins over auto", req.resolveTarget(req.loadConfig(), "hostOverseaVideo"),
      "upos-sz-mirrorhw.bilivideo.com");
    window.$argument = "host_oversea=upos-sz-mirrorhw.bilivideo.com";
    check("snake_case aliases reach the same field",
      req.loadConfig().hostOverseaVideo, "upos-sz-mirrorhw.bilivideo.com");
    window.$argument = "hostOverseaVideo={{{hostOverseaVideo}}}";
    check("an unsubstituted placeholder falls back to auto", req.loadConfig().hostOverseaVideo, "auto");
    window.$argument = "hostPcdn=https://upos-sz-mirrorcos.bilivideo.com:443/upgcxcode/";
    check("a pasted url is reduced to the host", req.loadConfig().hostPcdn, "upos-sz-mirrorcos.bilivideo.com");
    window.$argument = "";
  }

  // ---- 3. rank drives auto ------------------------------------------------

  section("rank drives auto");
  {
    const store = rankStore([RANK_A, "upos-sz-mirrorcosov.bilivideo.com"]);
    const akam = await asRequest("http://upos-hz-mirrorakam.akamaized.net/upgcxcode/1/2/3.m4s?deadline=1&os=akam",
      "", Object.assign({}, store));
    check("akam goes to the fastest measured host", hostOf(akam.donePayload.url), RANK_A);
    check("the query is preserved", req.parseUrl(akam.donePayload.url).query, "?deadline=1&os=akam");

    const mirror = await asRequest("http://upos-tf-all-tx.bilivideo.com/upgcxcode/x", "", Object.assign({}, store));
    check("another mainland mirror also collapses onto the fastest", hostOf(mirror.donePayload.url), RANK_A);

    const already = await asRequest("http://" + RANK_A + "/upgcxcode/x", "", Object.assign({}, store));
    check("the fastest host itself is left alone (no loop)", already.donePayload, {});

    const noRank = await asRequest("http://upos-hz-mirrorakam.akamaized.net/upgcxcode/x", "", {});
    check("without a ranking it falls back to the bootstrap host",
      hostOf(noRank.donePayload.url), req.resolveTarget(req.loadConfig(), "hostOverseaVideo"));
    checkTrue("the fallback is a real mirror", /bilivideo\.com$/.test(req.resolveTarget(req.loadConfig(), "hostPcdn")));

    const pinned = await asRequest("http://upos-hz-mirrorakam.akamaized.net/upgcxcode/x",
      "hostOverseaVideo=upos-sz-mirrorhw.bilivideo.com", Object.assign({}, store));
    check("a pinned host beats the ranking", hostOf(pinned.donePayload.url), "upos-sz-mirrorhw.bilivideo.com");

    const pinnedPcdn = await asRequest("http://upos-sz-mirrorcos.bilivideo.com/upgcxcode/x",
      "hostPcdn=upos-sz-mirrorcos.bilivideo.com", Object.assign({}, store));
    check("with hostPcdn pinned, a mainland mirror stays put (upstream semantics)", pinnedPcdn.donePayload, {});
  }

  // ---- 3b. preferHk -------------------------------------------------------

  section("preferHk");
  {
    const HK = "cn-hk-eq-01-01.bilivideo.com";
    const store = rankStore([RANK_A, HK, "upos-sz-mirrorcosov.bilivideo.com"]);
    check("the switch is off by default on both sides",
      [req.DEFAULTS.preferHk, pl.DEFAULTS.preferHk], [false, false]);

    const off = await asRequest("http://upos-hz-mirrorakam.akamaized.net/upgcxcode/x", "", Object.assign({}, store));
    check("off: the fastest host is still the target", hostOf(off.donePayload.url), RANK_A);

    const on = await asRequest("http://upos-hz-mirrorakam.akamaized.net/upgcxcode/x", "preferHk=true",
      Object.assign({}, store));
    check("on: the Hong Kong node wins even though it is not the fastest",
      hostOf(on.donePayload.url), HK);

    const onMirror = await asRequest("http://upos-tf-all-tx.bilivideo.com/upgcxcode/x", "preferHk=true",
      Object.assign({}, store));
    check("on: the mainland category follows it too", hostOf(onMirror.donePayload.url), HK);

    const alias = await asRequest("http://upos-hz-mirrorakam.akamaized.net/upgcxcode/x", "prefer_hk=true",
      Object.assign({}, store));
    check("the snake_case alias reaches the same field", hostOf(alias.donePayload.url), HK);

    const pinned = await asRequest("http://upos-hz-mirrorakam.akamaized.net/upgcxcode/x",
      "preferHk=true&hostOverseaVideo=upos-sz-mirrorhw.bilivideo.com", Object.assign({}, store));
    check("a pinned host still beats the Hong Kong preference",
      hostOf(pinned.donePayload.url), "upos-sz-mirrorhw.bilivideo.com");

    const noHk = await asRequest("http://upos-hz-mirrorakam.akamaized.net/upgcxcode/x", "preferHk=true",
      rankStore([RANK_A, "upos-sz-mirrorcosov.bilivideo.com"]));
    check("on but no Hong Kong node ranked: falls back to the overall fastest",
      hostOf(noHk.donePayload.url), RANK_A);

    const resSide = await asResponse("https://api.bilibili.com/pgc/player/web/playurl?x=1",
      JSON.stringify({ data: { dash: { video: [{ baseUrl: "http://upos-sz-mirrorcosov.bilivideo.com/upgcxcode/1.m4s" }] } } }),
      "preferHk=true", Object.assign({}, store));
    check("the response side picks the Hong Kong node as well",
      hostOf(JSON.parse(resSide.donePayload.body).data.dash.video[0].baseUrl), HK);

    check("isHkHost matches the Equinix group and nothing else",
      [probe.isHkHost(HK), probe.isHkHost("upos-sz-mirrorcosov.bilivideo.com"), probe.isHkHost("")],
      [true, false, false]);
    check("targetIndex points at the Hong Kong node",
      probe.targetIndex({ preferHk: true }, { ranking: ["a.bilivideo.com", HK] }), 1);
    check("targetIndex stays at the top without the switch",
      probe.targetIndex({ preferHk: false }, { ranking: ["a.bilivideo.com", HK] }), 0);
    check("targetIndex stays at the top when no Hong Kong node ranked",
      probe.targetIndex({ preferHk: true }, { ranking: ["a.bilivideo.com"] }), 0);
  }

  // ---- 4. MCDN / PCDN port matrix -----------------------------------------

  section("MCDN / PCDN");
  {
    const fixed = "hostOverseaVideo=upos-sz-mirrorali.bilivideo.com" +
      "&hostBStar=upos-sz-mirrorali.bilivideo.com&hostPcdn=upos-sz-mirrorali.bilivideo.com";
    const expect = async (name, url, expected) => {
      const run = await asRequest(url, fixed, {});
      check(name, run.donePayload.url || null, expected);
    };
    await expect("mcdn no port, http /v1/resource/ -> :8000",
      "http://xy1x2x3x4xy.mcdn.bilivideo.cn/v1/resource/3.m4s?a=1",
      "http://xy1x2x3x4xy.mcdn.bilivideo.cn:8000/v1/resource/3.m4s?a=1");
    await expect("mcdn no port, https /upgcxcode/ -> :4483",
      "https://xy1x2x3x4xy.mcdn.bilivideo.cn/upgcxcode/3.m4s",
      "https://xy1x2x3x4xy.mcdn.bilivideo.cn:4483/upgcxcode/3.m4s");
    await expect("mcdn :486 with cdn",
      "http://x.mcdn.bilivideo.cn:486/upgcxcode/3.m4s?cdn=abc",
      "http://d1--abc.bilivideo.com/upgcxcode/3.m4s?cdn=abc");
    await expect("mcdn :486 with sid",
      "http://x.mcdn.bilivideo.cn:486/upgcxcode/3.m4s?sid=xyz",
      "http://xyz.bilivideo.com/upgcxcode/3.m4s?sid=xyz");
    await expect("mcdn :4483 is wrapped by the proxy",
      "http://x.mcdn.bilivideo.cn:4483/upgcxcode/3.m4s",
      "http://proxy-tf-all-ws.bilivideo.com/?url=" + encodeURIComponent("http://x.mcdn.bilivideo.cn:4483/upgcxcode/3.m4s"));
    await expect("pcdn :4480 returns to xy_usource",
      "https://1.2.3.4:4480/upgcxcode/3.m4s?xy_usource=upos-sz-mirrorhw.bilivideo.com",
      "http://upos-sz-mirrorhw.bilivideo.com/upgcxcode/3.m4s?xy_usource=upos-sz-mirrorhw.bilivideo.com");
    await expect("pcdn :4480 without xy_usource falls back to hostPcdn",
      "https://1.2.3.4:4480/upgcxcode/3.m4s", "http://upos-sz-mirrorali.bilivideo.com/upgcxcode/3.m4s");
    await expect("pcdn :9305 takes the host from the path",
      "http://1.2.3.4:9305/upos-sz-mirrorcos.bilivideo.com/upgcxcode/3.m4s",
      "http://upos-sz-mirrorcos.bilivideo.com/upgcxcode/3.m4s");
    await expect("already wrapped (:4483 with originalUrl) is skipped",
      "http://x.mcdn.bilivideo.cn:4483/upgcxcode/3.m4s?originalUrl=http%3A%2F%2Fa.b%2Fc", null);
    await expect("the resource form on :8000 is left alone",
      "http://x.mcdn.bilivideo.cn:8000/v1/resource/3.m4s", null);
    await expect("mcdn :486 without cdn/sid is left alone",
      "http://x.mcdn.bilivideo.cn:486/upgcxcode/3.m4s", null);
    await expect("a non-media-request is not touched", "http://x.mcdn.bilivideo.cn:1/other", null);
  }

  // ---- 5. request role counters + debug -----------------------------------

  section("request role");
  {
    const run = await asRequest("http://upos-hz-mirrorakam.akamaized.net/upgcxcode/x", "", rankStore([RANK_A]));
    const stats = JSON.parse(run.store[K_STATS]);
    check("a rewrite is counted", [stats.calls, stats.rewrites], [1, 1]);
    check("the last move is recorded (with a readable reason)",
      [stats.last.reason, stats.last.to], ["港澳台", RANK_A]);

    const quiet = await asRequest("http://upos-hz-mirrorakam.akamaized.net/upgcxcode/x", "", rankStore([RANK_A]));
    check("no debug line without debug", quiet.logs.length, 0);
    const loud = await asRequest("http://upos-hz-mirrorakam.akamaized.net/upgcxcode/x", "debug=true", rankStore([RANK_A]));
    check("one debug line with debug", loud.logs.length, 1);
    checkTrue("it names the move", loud.logs[0].indexOf("oversea-video") !== -1 && loud.logs[0].indexOf(RANK_A) !== -1);
    checkTrue("it stays short (Surge elides long lines)", loud.logs[0].length <= 120);
  }

  // ---- 6. playurl: JSON ---------------------------------------------------

  section("playurl JSON");
  {
    const payload = JSON.stringify({
      code: 0,
      data: {
        dash: { video: [{ baseUrl: "http://upos-hz-mirrorakam.akamaized.net/upgcxcode/1/2/3.m4s?deadline=1",
          backupUrl: ["http://upos-sz-mirrorcosov.bilivideo.com/upgcxcode/1/2/3.m4s?deadline=1"] }] },
        durl: [{ url: "http://upos-sz-mirroraliov.bilivideo.com/upgcxcode/9/8/7.m4s" }]
      }
    });
    const run = await asResponse("https://api.bilibili.com/pgc/player/web/playurl?x=1", payload, "", rankStore([RANK_A]));
    const out = JSON.parse(run.donePayload.body);
    check("base_url moves to the fastest host",
      hostOf(out.data.dash.video[0].baseUrl), RANK_A);
    check("a backup url of the same category moves too",
      hostOf(out.data.dash.video[0].backupUrl[0]), RANK_A);
    check("durl moves as well", hostOf(out.data.durl[0].url), RANK_A);
    check("the signed query survives", req.parseUrl(out.data.dash.video[0].baseUrl).query, "?deadline=1");
    check("three rewrites are counted", JSON.parse(run.store[K_STATS]).rewrites, 3);

    const same = await asResponse("https://api.bilibili.com/x/player/playurl?x=1",
      JSON.stringify({ data: { dash: { video: [{ baseUrl: "http://" + RANK_A + "/upgcxcode/1.m4s" }] } } }),
      "", rankStore([RANK_A]));
    check("a body already on the target is untouched", same.donePayload, {});

    const other = await asResponse("https://api.bilibili.com/x/player/playurl?x=1",
      JSON.stringify({ data: { list: [{ pic: "http://i0.hdslb.com/bfs/a.jpg" }] } }), "", rankStore([RANK_A]));
    check("a body without media urls is untouched", other.donePayload, {});
    check("but it is still counted as a call", JSON.parse(other.store[K_STATS]).calls, 1);
  }

  // ---- 7. playurl: gRPC ---------------------------------------------------

  section("playurl gRPC");
  {
    const vint = (n) => { const o = []; let v = n; do { const b = v % 128; v = Math.floor(v / 128); o.push(v ? b + 128 : b); } while (v); return o; };
    const ldf = (field, bytes) => [field << 3 | 2].concat(vint(bytes.length), bytes);
    const sfield = (field, s) => ldf(field, Array.from(s).map((c) => c.charCodeAt(0)));
    const urlOf = (h) => "http://" + h + "/upgcxcode/1/2/3.m4s?deadline=1";
    const message = (host) => new Uint8Array([].concat(
      sfield(1, "playurl-id"),
      ldf(2, [].concat(sfield(1, urlOf(host)), sfield(3, "backup"))),
      sfield(4, "tail")
    ));
    const be32 = (n) => [Math.floor(n / 16777216) % 256, Math.floor(n / 65536) % 256, Math.floor(n / 256) % 256, n % 256];
    const frame = (bytes, flag) => new Uint8Array([].concat([flag || 0], be32(bytes.length), Array.from(bytes)));
    const stringsOf = (buf) => {
      const out = [];
      (function walk(s, e) {
        let p = s;
        while (p < e) {
          const t = readV(buf, p, e); if (!t) return;
          p = t.n; const w = t.v & 7, f = t.v >> 3;
          if (w === 0) { const x = readV(buf, p, e); if (!x) return; p = x.n; }
          else if (w === 1) { if (p + 8 > e) return; p += 8; }
          else if (w === 5) { if (p + 4 > e) return; p += 4; }
          else if (w === 2) {
            const l = readV(buf, p, e); if (!l) return; p = l.n;
            const pe = p + l.v; if (pe > e) return;
            const before = out.length; walk(p, pe);
            if (out.length === before) { let str = ""; for (let i = p; i < pe; i++) str += String.fromCharCode(buf[i]); out.push(str); }
            p = pe;
          } else return;
        }
      })(0, buf.length);
      return out;
    };
    function readV(buf, p, e) { let v = 0, sh = 0; while (p < e) { const b = buf[p++]; v += (b & 127) * Math.pow(2, sh); if (!(b & 128)) return { v, n: p }; sh += 7; if (sh > 63) return null; } return null; }

    const equal = await asResponse("https://grpc.biliapi.net/bilibili.app.playerunite.v1.Player/PlayViewUnite",
      frame(message("upos-tf-all-tx.bilivideo.com"), 0), "", rankStore([RANK_A]));
    checkTrue("a frame is rewritten", !!equal.donePayload.body);
    check("the rewritten frame keeps flag 0", equal.donePayload.body[0], 0);
    check("it parses back with the new host",
      stringsOf(equal.donePayload.body.slice(5)),
      ["playurl-id", urlOf(RANK_A), "backup", "tail"]);
    check("an equal-length swap keeps the size",
      equal.donePayload.body.length, frame(message("upos-tf-all-tx.bilivideo.com"), 0).length);

    const grow = await asResponse("https://grpc.biliapi.net/bilibili.app.playerunite.v1.Player/PlayViewUnite",
      frame(message("upos-hz-mirrorakam.akamaized.net"), 0), "", rankStore([RANK_A]));
    check("a longer host grows by exactly the delta",
      grow.donePayload.body.length - frame(message("upos-hz-mirrorakam.akamaized.net"), 0).length,
      RANK_A.length - "upos-hz-mirrorakam.akamaized.net".length);
    check("the resized frame still parses back",
      stringsOf(grow.donePayload.body.slice(5)), ["playurl-id", urlOf(RANK_A), "backup", "tail"]);

    // compressed frames: without $utils they stay byte-identical, with it they come back uncompressed
    const gz = new Uint8Array([].concat([1], be32(7), [31, 139, 8, 0, 1, 2, 3]));
    const noUtils = await asResponse("https://grpc.biliapi.net/x", gz, "", rankStore([RANK_A]));
    check("a compressed frame is left alone without $utils", noUtils.donePayload, {});

    const plain = message("upos-hz-mirrorakam.akamaized.net");
    const withUtils = await asResponse("https://grpc.biliapi.net/x", gz, "", rankStore([RANK_A]),
      {}, { ungzip: () => plain });
    checkTrue("with $utils.ungzip it is rewritten", !!withUtils.donePayload.body);
    check("and comes back as an uncompressed frame", withUtils.donePayload.body[0], 0);
    check("with a correct length prefix", withUtils.donePayload.body.length, 5 + message(RANK_A).length);
    check("the rewritten body parses back",
      stringsOf(withUtils.donePayload.body.slice(5)), ["playurl-id", urlOf(RANK_A), "backup", "tail"]);
    check("the uncompressed frame is counted",
      JSON.parse(withUtils.store[K_STATS]).reasons["oversea-video"], 1);

    const notProto = await asResponse("https://grpc.biliapi.net/x", new Uint8Array([7, 7, 7, 7, 7, 7]), "", rankStore([RANK_A]));
    check("a body that is not a frame stream is left alone", notProto.donePayload, {});
  }

  // ---- 8. speed test + panel ----------------------------------------------

  section("speed test and panel");
  {
    check("the pool is the upos mirror list plus the Hong Kong nodes", probe.CANDIDATE_POOL.length, 16);
    check("akam is not in the pool (it 403s upos-signed samples)",
      probe.CANDIDATE_POOL.some((h) => /akamaized/.test(h)), false);
    check("the Hong Kong Equinix nodes are in the pool",
      probe.CANDIDATE_POOL.filter((h) => /^cn-hk-eq-/.test(h)).length, 8);
    checkTrue("every pool host is a plain hostname",
      probe.CANDIDATE_POOL.every((h) => /^[a-z0-9.-]+$/.test(h)));

    // 香港节点与 akam/*ov 同属"港澳台"分类：赢了排名就会被选为目标。
    const hkStore = rankStore(["cn-hk-eq-01-01.bilivideo.com"]);
    const hkAkam = await asRequest("http://upos-hz-mirrorakam.akamaized.net/upgcxcode/x", "", Object.assign({}, hkStore));
    check("a Hong Kong node can win and be used as the target",
      hostOf(hkAkam.donePayload.url), "cn-hk-eq-01-01.bilivideo.com");
    const hkOv = await asRequest("http://upos-sz-mirrorcosov.bilivideo.com/upgcxcode/x", "", Object.assign({}, hkStore));
    check("an *ov host follows it too", hostOf(hkOv.donePayload.url), "cn-hk-eq-01-01.bilivideo.com");
    const hkPgc = await asResponse("https://api.bilibili.com/pgc/player/web/playurl?x=1",
      JSON.stringify({ data: { dash: { video: [{ baseUrl: "http://cn-hk-eq-01-09.bilivideo.com/upgcxcode/1.m4s" }] } } }),
      "", rankStore([RANK_A]));
    check("on the response side a Hong Kong source moves to the fastest",
      hostOf(JSON.parse(hkPgc.donePayload.body).data.dash.video[0].baseUrl), RANK_A);

    const ranked = probe.rankSamples([
      { host: "a", ok: true, mbps: 10, ms: 100 },
      { host: "b", ok: false, mbps: 0, ms: 50 },
      { host: "c", ok: true, mbps: 30, ms: 200 },
      { host: "d", ok: true, mbps: 30, ms: 120 }
    ]);
    check("rejected hosts are dropped", ranked.length, 3);
    check("sorted by throughput then latency", ranked.map((r) => r.host), ["d", "c", "a"]);
    check("the swapped probe url keeps the signed query",
      probe.swapHost("http://upos-sz-mirrorcosov.bilivideo.com/upgcxcode/1.m4s?deadline=1", "upos-tf-all-hw.bilivideo.com"),
      "http://upos-tf-all-hw.bilivideo.com/upgcxcode/1.m4s?deadline=1");
    check("the sample finder picks a signed segment",
      probe.findSample({ data: { dash: { video: [{ baseUrl: "https://upos-sz-mirrorcos.bilivideo.com/upgcxcode/1/2/3.m4s?deadline=1" }] } } }),
      "https://upos-sz-mirrorcos.bilivideo.com/upgcxcode/1/2/3.m4s?deadline=1");
    check("it skips mcdn urls",
      probe.findSample({ url: "http://xy1x2x3x4xy.mcdn.bilivideo.cn:9102/upgcxcode/3.m4s" }), null);

    const idle = await asPanel("notify=false", {});
    check("the panel title carries the version", idle.donePayload.title, "B站CDN v" + VERSION);
    checkTrue("it says nothing was measured yet", idle.donePayload.content.indexOf("尚未测速") !== -1);
    check("style is info with no ranking", idle.donePayload.style, "info");
    check("an idle panel makes no requests", idle.httpCalls.length, 0);

    const stored = await asPanel("notify=false", Object.assign({}, rankStore([RANK_A, "upos-sz-mirrorcosov.bilivideo.com"]), {
      [K_STATS]: JSON.stringify({ calls: 12, rewrites: 5, reasons: { "oversea-video": 5 },
        last: { reason: "港澳台", from: "upos-hz-mirrorakam.akamaized.net", to: RANK_A, at: clock.now } })
    }));
    checkTrue("it names the fastest host", stored.donePayload.content.indexOf("tf-all-hw") !== -1);
    checkTrue("it shows the counters", stored.donePayload.content.indexOf("命中12 改写5") !== -1);
    checkTrue("it shows the last move", stored.donePayload.content.indexOf("最近 港澳台：") !== -1);
    check("style is good once rewrites happened", stored.donePayload.style, "good");
    checkTrue("without the switch the card keeps saying 最快",
      stored.donePayload.content.indexOf("港优先") === -1);

    const hkPanel = await asPanel("notify=false&preferHk=true", rankStore([RANK_A, "cn-hk-eq-01-01.bilivideo.com"], {
      samples: [{ host: RANK_A, mbps: 40, ms: 80 }, { host: "cn-hk-eq-01-01.bilivideo.com", mbps: 12, ms: 60 }]
    }));
    checkTrue("the card leads with the Hong Kong target",
      hkPanel.donePayload.content.indexOf("港优先 cn-hk-eq-01-01") !== -1);
    checkTrue("the rate shown belongs to that node, not to the fastest",
      hkPanel.donePayload.content.indexOf("12.0 Mbps") !== -1);
    checkTrue("and the overall fastest is still visible",
      hkPanel.donePayload.content.indexOf("全场最快 tf-all-hw") !== -1);

    const hkNone = await asPanel("notify=false&preferHk=true",
      rankStore([RANK_A, "upos-sz-mirrorcosov.bilivideo.com"]));
    checkTrue("with no Hong Kong node ranked the card says so",
      hkNone.donePayload.content.indexOf("本轮无香港节点通过测速") !== -1);

    // 测速那一轮的通知也要说清"发给了谁"：标题是被选中的目标，正文第一行仍是全场最快。
    const notified = await runSurge(SRC_PROBE, { argument: "notify=true&preferHk=true", store: {}, http: anyProbe });
    check("the probe announces the Hong Kong target when the switch is on",
      notified.notifications[0][1], "港优先 cn-hk-eq-01-01");
    checkTrue("the body still lists the overall fastest first",
      notified.notifications[0][2].indexOf("sz-mirrorcosov") !== -1);

    const tapped = await asPanel("notify=false", {}, "button", anyProbe);
    checkTrue("tapping refresh probes", tapped.httpCalls.length > 0);
    checkTrue("it stored a ranking", !!tapped.store[K_RANK]);
    checkTrue("it reports a measured rate", tapped.donePayload.content.indexOf("Mbps") !== -1);
    checkTrue("the probe used seconds-scale timeouts",
      tapped.httpCalls.every((o) => typeof o.timeout === "number" && o.timeout > 0 && o.timeout <= 30));
    checkTrue("the probe asked for a bounded range",
      tapped.httpCalls.some((o) => o.headers && o.headers.Range === "bytes=0-1048575"));
  }

  // ---- 9. the module files agree with the scripts --------------------------

  section("modules");
  {
    const versioned = (mod) => mod.split("\n").filter((l) => l.indexOf("script-path=") !== -1);
    check("the request module has three script entries", versioned(MOD_REQUEST).length, 3);
    check("the playurl module has six script entries", versioned(MOD_PLAYURL).length, 6);
    [["request", MOD_REQUEST], ["playurl", MOD_PLAYURL]].forEach((pair) => {
      const paths = versioned(pair[1]);
      checkTrue("every " + pair[0] + " script-path is versioned with the scripts' VERSION",
        paths.every((l) => l.indexOf("?v=" + VERSION) !== -1));
      checkTrue("the " + pair[0] + " module desc carries the version",
        pair[1].indexOf("#!desc=v" + VERSION) !== -1);
      checkTrue("the " + pair[0] + " module has a cron probe pointing at bili-speedtest.js",
        /type=cron/.test(pair[1]) && /bili-speedtest\.js/.test(pair[1]));
      checkTrue("the " + pair[0] + " panel reads the speedtest script",
        /\[Panel\][\s\S]*script-name=BiliFastCDN-Panel/.test(pair[1]) &&
        /BiliFastCDN-Panel = type=generic[\s\S]*bili-speedtest\.js/.test(pair[1]));
    });

    checkTrue("the request module points its rewriting entry at bili-cdn.js",
      /BiliFastCDN-CDN = type=http-request[\s\S]*bili-cdn\.js/.test(MOD_REQUEST));
    checkTrue("it forces the odd ports through the http engine",
      /force-http-engine-hosts[\s\S]*\*:4480[\s\S]*\*:4483[\s\S]*\*:8000[\s\S]*\*:8082[\s\S]*\*:9102/.test(MOD_REQUEST));
    checkTrue("its pattern covers mirrors, akam, Hong Kong, mcdn and pcdn",
      /pattern=\^https\?:/.test(MOD_REQUEST) && /mcdn/.test(MOD_REQUEST) &&
      /cn-hk-eq-/.test(MOD_REQUEST) && /4480/.test(MOD_REQUEST) && /akamaized/.test(MOD_REQUEST));
    checkTrue("its mitm list covers the Hong Kong hosts too",
      /\[MITM\][\s\S]*cn-hk-eq-\*/.test(MOD_REQUEST));
    checkTrue("it passes the four targets to the script",
      ["hostOverseaVideo", "hostBStar", "hostPcdn", "hostMcdn"]
        .every((k) => MOD_REQUEST.indexOf(k + "={{{" + k + "}}}") !== -1));

    // 香港优先开关：两个模块的参数字典都要有它，而且每一个脚本条目都要收到它 ——
    // 面板要按它换第一行，两个后端要按它挑目标，漏传哪一个都会让"开了但没反应"。
    checkTrue("both modules declare the Hong Kong switch (default off)",
      /#!arguments=[^\n]*preferHk:false/.test(MOD_REQUEST) &&
      /#!arguments=[^\n]*preferHk:false/.test(MOD_PLAYURL));
    checkTrue("both explain it in the parameter table",
      /#!arguments-desc=[^\n]*preferHk:/.test(MOD_REQUEST) &&
      /#!arguments-desc=[^\n]*preferHk:/.test(MOD_PLAYURL));
    check("the request module passes it to all three scripts",
      MOD_REQUEST.split("preferHk={{{preferHk}}}").length - 1, 3);
    check("the playurl module passes it to all six scripts",
      MOD_PLAYURL.split("preferHk={{{preferHk}}}").length - 1, 6);

    ["PlayViewUnite", "PlayURL/PlayView", "pgc/player/(api|web)/playurl", "pgc/player/web/v2/playurl"]
      .forEach((token) => {
        checkTrue("the playurl module covers " + token, MOD_PLAYURL.indexOf(token) !== -1);
      });
    check("the gRPC entries buffer binary bodies",
      (MOD_PLAYURL.match(/binary-body-mode=1/g) || []).length, 2);
    checkTrue("the gRPC entries use the webview engine (as the beta module does)",
      (MOD_PLAYURL.match(/engine=webview/g) || []).length >= 2);
    checkTrue("the playurl module mitms the API hosts",
      /\[MITM\][\s\S]*grpc\.biliapi\.net/.test(MOD_PLAYURL) && /app\.bilibili\.com/.test(MOD_PLAYURL));

    // no leftovers from the previous engines
    ["grpcGunzip", "mediaRewrite", "mcdnStrategy", "backupFanout", "enabled=", "hostOversea=", "hostAkamai"]
      .forEach((token) => {
        checkTrue("no leftover " + token + " in either module",
          MOD_REQUEST.indexOf(token) === -1 && MOD_PLAYURL.indexOf(token) === -1);
      });
  }

  render(true);
  document.title = pass === (pass + failures.length) ? "PASS" : "FAIL";
})();
</script>
