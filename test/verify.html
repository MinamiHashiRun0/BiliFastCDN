<!doctype html>
<meta charset="utf-8">
<title>running</title>
<pre id="report">running…</pre>
<script>
// Surface anything that escapes the suite, instead of leaving "running…" behind.
function fail(reason) {
  document.title = "ERROR";
  const el = document.getElementById("report");
  el.textContent = el.textContent + "\n\n!! THREW\n\n" + reason;
}
window.addEventListener("error", (e) => fail((e.error && e.error.stack) || e.message));
window.addEventListener("unhandledrejection", (e) => fail((e.reason && e.reason.stack) || String(e.reason)));
</script>
<script>
/*
 * Offline verification for ../bili-cdn.js + ../BiliFastCDN.sgmodule.
 *
 * The backend is a port of Biliverse/Redirect's Surge implementation
 * (src/process/Request.mjs + template/surge.handlebars, Apache-2.0). Every case
 * below is written with the upstream branch it mirrors named in the check, so a
 * regression shows which rule drifted.
 *
 * Chrome refuses to read a file:// page's siblings without an explicit flag:
 *
 *   chrome --headless=new --disable-gpu --allow-file-access-from-files \
 *          --virtual-time-budget=20000 --dump-dom test/verify.html
 */

(async function () {
  "use strict";

  const lines = [];
  let pass = 0;
  const failures = [];

  function check(name, actual, expected) {
    const a = JSON.stringify(actual);
    const e = JSON.stringify(expected);
    if (a === e) { pass += 1; return; }
    failures.push(name + "\n     expected " + e + "\n     actual   " + a);
  }
  function checkTrue(name, actual) { check(name, !!actual, true); }
  function note(text) { lines.push("   " + text); }

  function render(final) {
    const total = pass + failures.length;
    const head = final
      ? (pass === total ? "ALL " + total + " CHECKS PASSED" : (total - pass) + " OF " + total + " CHECKS FAILED")
      : "progress: " + pass + " passed, " + failures.length + " failed";
    document.querySelector("#report").textContent = head + "\n" + lines.join("\n") +
      (failures.length ? "\n\nFAILURES\n\n" + failures.map((f) => "  " + f).join("\n\n") : "");
  }

  function section(title) {
    lines.push("");
    lines.push("── " + title);
    render(false);
  }

  const clock = { now: 1700000000000 };
  Date.now = () => clock.now;

  async function readText(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.text();
  }

  const SOURCE = await readText("../bili-cdn.js");
  const MODULE = await readText("../BiliFastCDN.sgmodule");

  window.module = { exports: {} };
  window.eval(SOURCE);
  const api = window.module.exports;

  const K_STATS = "bili_fast_cdn.redirect.v1";
  const DEFAULT_HOST = "upos-sz-mirrorali.bilivideo.com";

  // Runs the script the way Surge would. $httpClient throws on purpose: this
  // backend never makes a request of its own (no probing, no speed test).
  function runSurge(globals) {
    return new Promise((resolve, reject) => {
      const store = Object.assign({}, globals.store || {});
      const run = { store, logs: [], donePayload: null, doneCount: 0 };

      window.$persistentStore = {
        read: (k) => (Object.prototype.hasOwnProperty.call(store, k) ? store[k] : null),
        write: (v, k) => { store[k] = String(v); return true; }
      };
      window.$httpClient = { get: () => { throw new Error("this backend must never issue requests"); } };
      window.$notification = { post: () => { throw new Error("this backend must never notify"); } };
      window.$done = (payload) => {
        run.doneCount += 1;
        run.donePayload = payload === undefined ? null : payload;
        resolve(run);
      };
      window.$argument = globals.argument;
      window.console.log = (m) => run.logs.push(String(m));

      if (globals.request) window.$request = globals.request; else delete window.$request;
      if (globals.input) window.$input = globals.input; else delete window.$input;

      try {
        window.eval(SOURCE);
      } catch (e) { reject(e); return; }
      setTimeout(() => resolve(run), 2000);
    });
  }

  const asRequest = (url, argument, store) => runSurge({
    request: { url, method: "GET" }, argument, store: store || {}
  });

  function hostOf(url) { const p = api.parseUrl(url); return p ? p.host : null; }
  function portOf(url) { const p = api.parseUrl(url); return p ? p.port : null; }
  function pathOf(url) { const p = api.parseUrl(url); return p ? p.path + p.query : null; }

  // ---- 1. url primitives -------------------------------------------------

  section("url primitives");
  {
    const p = api.parseUrl("http://a.b.c:4483/upgcxcode/1.m4s?os=mcdn&x=1");
    check("parseUrl scheme", p.scheme, "http");
    check("parseUrl host", p.host, "a.b.c");
    check("parseUrl port", p.port, "4483");
    check("parseUrl path", p.path, "/upgcxcode/1.m4s");
    check("parseUrl query", p.query, "?os=mcdn&x=1");
    check("parseUrl on garbage", api.parseUrl("not a url"), null);
    check("buildUrl without port", api.buildUrl("https", "h", "", "/p", "?q=1"), "https://h/p?q=1");
    check("buildUrl with port", api.buildUrl("http", "h", "486", "/p", ""), "http://h:486/p");
    check("queryParam decodes", api.queryParam("?a=1&xy_usource=upos-sz-mirrorhw.bilivideo.com", "xy_usource"),
      "upos-sz-mirrorhw.bilivideo.com");
    check("queryParam decodes percent-encoded values", api.queryParam("?url=a%2Fb%3Fc%3D1", "url"), "a/b?c=1");
    check("queryParam missing", api.queryParam("?a=1", "b"), null);
  }

  // ---- 2. configuration --------------------------------------------------

  section("configuration");
  {
    const cfg = api.loadConfig();
    check("Redirect's default targets", [cfg.hostOverseaVideo, cfg.hostBStar, cfg.hostPcdn],
      [DEFAULT_HOST, DEFAULT_HOST, DEFAULT_HOST]);
    check("Redirect's MCDN default", cfg.hostMcdn, "proxy-tf-all-ws.bilivideo.com");
    check("debug defaults off", cfg.debug, false);

    const over = await runSurge({ request: { url: "http://127.0.0.1:4480/x" },
      argument: "hostOverseaVideo=upos-sz-mirrorhw.bilivideo.com&hostPcdn=upos-sz-mirrorcos.bilivideo.com&debug=true" });
    check("an argument override reaches the panel", over.doneCount, 1);

    window.$argument = "hostPcdn=https://upos-sz-mirrorcos.bilivideo.com:443/upgcxcode/";
    const sanitised = api.loadConfig();
    check("a pasted url is reduced to the host", sanitised.hostPcdn, "upos-sz-mirrorcos.bilivideo.com");

    window.$argument = "host_oversea_video=upos-sz-mirrorhw.bilivideo.com";
    check("snake_case aliases work", api.loadConfig().hostOverseaVideo, "upos-sz-mirrorhw.bilivideo.com");

    window.$argument = "hostOverseaVideo={{{hostOverseaVideo}}}";
    check("an unsubstituted placeholder falls back to the default",
      api.loadConfig().hostOverseaVideo, DEFAULT_HOST);

    window.$argument = "debug=on";
    check("debug accepts on", api.loadConfig().debug, true);
    window.$argument = "debug=false";
    check("debug accepts false", api.loadConfig().debug, false);
    window.$argument = "";
  }

  // ---- 3. hostname categories (Redirect's switch) ------------------------

  section("hostname categories");
  {
    const cfg = api.loadConfig();
    const cases = [
      // their fixed lists
      ["upos-hz-mirrorakam.akamaized.net", "hostOverseaVideo", "oversea-video"],
      ["upos-sz-mirrorakam.akamaized.net", "hostOverseaVideo", "oversea-video"],
      ["upos-sz-mirrorawsov.bilivideo.com", "hostOverseaVideo", "oversea-video"],
      ["upos-sz-mirroraliov.bilivideo.com", "hostOverseaVideo", "oversea-video"],
      ["upos-sz-mirrorcosov.bilivideo.com", "hostOverseaVideo", "oversea-video"],
      ["upos-sz-mirrorhwov.bilivideo.com", "hostOverseaVideo", "oversea-video"],
      ["upos-sz-mirroralibstar1.bilivideo.com", "hostBStar", "bstar"],
      ["upos-sz-mirrorcosbstar1.bilivideo.com", "hostBStar", "bstar"],
      ["upos-sz-mirrorhwbstar1.bilivideo.com", "hostBStar", "bstar"],
      ["upos-bstar1-mirrorakam.akamaized.net", "hostBStar", "bstar"],
      // wildcard fallbacks
      ["upos-sz-mirrorxxxxov.bilivideo.com", "hostOverseaVideo", "oversea-video"],
      ["cn-hk-eq-01-01.bilivideo.com", "hostOverseaVideo", "oversea-video"],
      ["upos-sz-mirrorweirdbstar1.bilivideo.com", "hostBStar", "bstar"]
    ];
    cases.forEach((c) => {
      const r = api.classifyHost(cfg, c[0]);
      check("category " + c[0], r && [r.host, r.reason], [cfg[c[1]], c[2]]);
    });

    // mainland mirrors are the targets themselves: never moved
    api.MAINLAND_MIRRORS.forEach((h) => {
      checkTrue("mainland mirror " + h + " is left alone", api.classifyHost(cfg, h) === null);
    });
  }

  // ---- 4. MCDN / PCDN port matrix ----------------------------------------

  section("MCDN / PCDN");
  {
    const cfg = api.loadConfig();
    const expect = (name, url, expected) => {
      const hit = api.rewriteRequest(url, cfg);
      check(name, hit ? hit.url : null, expected);
    };

    // .mcdn.bilivideo.cn with no port: retarget the port by path + protocol
    expect("mcdn http /v1/resource/ -> :8000",
      "http://xy1x2x3x4xy.mcdn.bilivideo.cn/v1/resource/3.m4s?a=1",
      "http://xy1x2x3x4xy.mcdn.bilivideo.cn:8000/v1/resource/3.m4s?a=1");
    expect("mcdn https /v1/resource/ -> :8082",
      "https://xy1x2x3x4xy.mcdn.bilivideo.cn/v1/resource/3.m4s",
      "https://xy1x2x3x4xy.mcdn.bilivideo.cn:8082/v1/resource/3.m4s");
    expect("mcdn http /upgcxcode/ -> :9102",
      "http://xy1x2x3x4xy.mcdn.bilivideo.cn/upgcxcode/3.m4s",
      "http://xy1x2x3x4xy.mcdn.bilivideo.cn:9102/upgcxcode/3.m4s");
    expect("mcdn https /upgcxcode/ -> :4483",
      "https://xy1x2x3x4xy.mcdn.bilivideo.cn/upgcxcode/3.m4s",
      "https://xy1x2x3x4xy.mcdn.bilivideo.cn:4483/upgcxcode/3.m4s");
    expect("mcdn with an unrelated path is left alone",
      "http://xy1x2x3x4xy.mcdn.bilivideo.cn/other/x", null);

    // :486 — cdn / sid
    expect("mcdn :486 with cdn",
      "http://x.mcdn.bilivideo.cn:486/upgcxcode/3.m4s?cdn=abc&x=1",
      "http://d1--abc.bilivideo.com/upgcxcode/3.m4s?cdn=abc&x=1");
    expect("mcdn :486 with sid",
      "http://x.mcdn.bilivideo.cn:486/upgcxcode/3.m4s?sid=xyz",
      "http://xyz.bilivideo.com/upgcxcode/3.m4s?sid=xyz");
    expect("mcdn :486 without cdn/sid is left alone",
      "http://x.mcdn.bilivideo.cn:486/upgcxcode/3.m4s", null);

    // :4483 / :9102 — proxy wrap
    expect("mcdn :4483 is wrapped by the proxy host",
      "http://x.mcdn.bilivideo.cn:4483/upgcxcode/3.m4s?trid=1",
      "http://proxy-tf-all-ws.bilivideo.com/?url=" +
      encodeURIComponent("http://x.mcdn.bilivideo.cn:4483/upgcxcode/3.m4s?trid=1"));
    expect("mcdn :9102 is wrapped too",
      "http://x.mcdn.bilivideo.cn:9102/upgcxcode/3.m4s",
      "http://proxy-tf-all-ws.bilivideo.com/?url=" +
      encodeURIComponent("http://x.mcdn.bilivideo.cn:9102/upgcxcode/3.m4s"));
    expect("a .bilivideo.com host on :4483 is skipped",
      "http://x.bilivideo.com:4483/upgcxcode/3.m4s", null);
    expect("an already wrapped url is skipped (no loop)",
      "http://x.mcdn.bilivideo.cn:4483/upgcxcode/3.m4s?originalUrl=http%3A%2F%2Fa.b%2Fc", null);
    expect("the resource form is left alone",
      "http://x.mcdn.bilivideo.cn:8000/v1/resource/3.m4s", null);

    // PCDN
    expect("pcdn :4480 returns to xy_usource",
      "https://1.2.3.4:4480/upgcxcode/3.m4s?xy_usource=upos-sz-mirrorhw.bilivideo.com&bw=1",
      "http://upos-sz-mirrorhw.bilivideo.com/upgcxcode/3.m4s?xy_usource=upos-sz-mirrorhw.bilivideo.com&bw=1");
    expect("pcdn :4480 without xy_usource falls back to the configured host",
      "https://1.2.3.4:4480/upgcxcode/3.m4s",
      "http://upos-sz-mirrorali.bilivideo.com/upgcxcode/3.m4s");
    expect("pcdn :9305 takes the host from the first path segment",
      "http://1.2.3.4:9305/upos-sz-mirrorcos.bilivideo.com/upgcxcode/3.m4s?x=1",
      "http://upos-sz-mirrorcos.bilivideo.com/upgcxcode/3.m4s?x=1");

    // host rules win over the port rules
    expect("an *ov host on a port still goes to the oversea target",
      "http://upos-sz-mirroraliov.bilivideo.com:4483/upgcxcode/3.m4s",
      "http://upos-sz-mirrorali.bilivideo.com/upgcxcode/3.m4s");
    // 大陆镜像就是"目标本身"：上游在 switch 里把它们 break 掉，端口分支也不会碰到它们。
    expect("a mainland mirror on a port is left alone",
      "http://upos-sz-mirrorali.bilivideo.com:80/upgcxcode/3.m4s", null);
  }

  // ---- 5. the request role ------------------------------------------------

  section("request role");
  {
    const rewritten = await asRequest("http://upos-hz-mirrorakam.akamaized.net/upgcxcode/1/2/3.m4s?deadline=1&os=akam",
      "hostOverseaVideo=upos-sz-mirrorhw.bilivideo.com");
    check("akam is redirected to the configured oversea target",
      rewritten.donePayload.url, "http://upos-sz-mirrorhw.bilivideo.com/upgcxcode/1/2/3.m4s?deadline=1&os=akam");
    check("the signed query is preserved", pathOf(rewritten.donePayload.url),
      "/upgcxcode/1/2/3.m4s?deadline=1&os=akam");

    const untouched = await asRequest("http://upos-sz-mirrorcos.bilivideo.com/upgcxcode/1/2/3.m4s", "");
    check("a mainland mirror passes through", untouched.donePayload, {});

    const stats = JSON.parse(rewritten.store[K_STATS]);
    check("a rewrite is counted", [stats.calls, stats.rewrites], [1, 1]);
    check("the reason is recorded", stats.last.reason, "oversea-video");
    check("the move is recorded", [stats.last.from, stats.last.to],
      ["upos-hz-mirrorakam.akamaized.net", "upos-sz-mirrorhw.bilivideo.com"]);

    const quiet = await asRequest("http://upos-hz-mirrorakam.akamaized.net/upgcxcode/x", "");
    check("passing through is counted too", JSON.parse(quiet.store[K_STATS]).calls, 1);
    check("but no debug line without debug", quiet.logs.length, 0);

    const loud = await asRequest("http://upos-hz-mirrorakam.akamaized.net/upgcxcode/x", "debug=true");
    check("debug logs the decision", loud.logs.length, 1);
    checkTrue("the debug line names the reason and the move",
      loud.logs[0].indexOf("oversea-video") !== -1 && loud.logs[0].indexOf(DEFAULT_HOST) !== -1);
    checkTrue("debug lines stay short (Surge elides long ones)", loud.logs[0].length <= 120);
    checkTrue("no signature material is logged",
      loud.logs.every((l) => l.indexOf("deadline=") === -1 && l.indexOf("sign=") === -1));

    // The app's HTTPDNS shape: the port carries the decision, so it works for an
    // IP-literal request too.
    const byIp = await asRequest("http://1.2.3.4:4480/upgcxcode/3.m4s?xy_usource=upos-sz-mirrorhw.bilivideo.com", "");
    check("an ip-literal pcdn request is still routed by xy_usource",
      byIp.donePayload.url, "http://upos-sz-mirrorhw.bilivideo.com/upgcxcode/3.m4s?xy_usource=upos-sz-mirrorhw.bilivideo.com");

    const garbage = await asRequest("not a url", "");
    check("a non-url passes through", garbage.donePayload, {});
  }

  // ---- 6. the panel role --------------------------------------------------

  section("panel role");
  {
    const input = { purpose: "panel", position: "policy-selection", panelName: "BiliFastCDN" };
    const idle = await runSurge({ input, argument: "hostMcdn=proxy-tf-all-ws.bilivideo.com" });
    check("the panel title carries the version", idle.donePayload.title, "B站CDN v" + api.VERSION);
    checkTrue("it shows the static target", idle.donePayload.content.indexOf("sz-mirrorali") !== -1);
    checkTrue("it shows the script counters", idle.donePayload.content.indexOf("脚本 命中0 改写0") !== -1);
    check("style is info before any rewrite", idle.donePayload.style, "info");
    checkTrue("it explains that regular mirrors are handled by the static rules",
      idle.donePayload.content.indexOf("静态规则") !== -1);

    const busy = await runSurge({
      input,
      argument: "hostOverseaVideo=upos-sz-mirrorhw.bilivideo.com",
      store: {
        [K_STATS]: JSON.stringify({
          calls: 9, rewrites: 4,
          reasons: { "mcdn-port": 3, "pcdn-upsource": 1 },
          last: { reason: "mcdn-port", from: "xy1x2x3x4xy.mcdn.bilivideo.cn",
            to: "xy1x2x3x4xy.mcdn.bilivideo.cn:9102", at: clock.now }
        })
      }
    });
    checkTrue("it shows the counters", busy.donePayload.content.indexOf("脚本 命中9 改写4") !== -1);
    checkTrue("it shows the configured target", busy.donePayload.content.indexOf("sz-mirrorhw") !== -1);
    checkTrue("it shows the last move with a readable reason",
      busy.donePayload.content.indexOf("最近 MCDN换端口：") !== -1);
    check("style turns good once something was rewritten", busy.donePayload.style, "good");
    check("the panel makes no requests", busy.doneCount, 1);
  }

  // ---- 7. the module file matches the script ------------------------------

  section("module file");
  {
    const moduleLines = MODULE.split("\n");
    const rules = moduleLines.filter((l) => /^\^https?:/.test(l));
    check("12 static rewrite rules (http + https for each family)", rules.length, 12);
    checkTrue("they target the oversea parameter",
      rules.every((l) => l.indexOf("{{{hostOverseaVideo}}}") !== -1 || l.indexOf("{{{hostBStar}}}") !== -1));
    checkTrue("every rule uses the host-rewrite type", rules.every((l) => l.indexOf(" header") !== -1));
    checkTrue("akam has its own rules", rules.some((l) => l.indexOf("upos-hz-mirrorakam") !== -1));
    checkTrue("the stray ports are forced through the http engine",
      /force-http-engine-hosts[\s\S]*\*:4480[\s\S]*\*:4483[\s\S]*\*:8000[\s\S]*\*:8082[\s\S]*\*:9102/.test(MODULE));
    checkTrue("mcdn and pcdn are the only request scripts",
      /BiliFastCDN-MCDN = type=http-request/.test(MODULE) && /BiliFastCDN-PCDN = type=http-request/.test(MODULE));
    checkTrue("the panel script is generic", /BiliFastCDN-Panel = type=generic/.test(MODULE));
    checkTrue("the panel section points at it", /script-name=BiliFastCDN-Panel/.test(MODULE));
    checkTrue("mitm covers the rewrite targets", /\[MITM\][\s\S]*upos-sz-mirror\*\.bilivideo\.com/.test(MODULE));

    // no leftovers from the previous engine
    ["grpcRewrite", "grpcGunzip", "mediaRewrite", "mcdnStrategy", "backupFanout",
      "type=cron", "type=http-response", "enabled=", "mode="].forEach((token) => {
      checkTrue("the old engine's " + token + " is gone", MODULE.indexOf(token) === -1);
    });

    // version discipline: desc == script ?v= == script's VERSION
    checkTrue("the module desc carries the version", MODULE.indexOf("#!desc=v" + api.VERSION) !== -1);
    const versioned = moduleLines.filter((l) => l.indexOf("script-path=") !== -1);
    check("every script-path is versioned", versioned.length, 3);
    checkTrue("every script-path uses the same version",
      versioned.every((l) => l.indexOf("?v=" + api.VERSION) !== -1));
    checkTrue("every request script gets the four targets",
      versioned.every((l) => ["hostOverseaVideo", "hostBStar", "hostPcdn", "hostMcdn"]
        .every((k) => l.indexOf(k + "={{{" + k + "}}}") !== -1)));
  }

  render(true);
  document.title = pass === (pass + failures.length) ? "PASS" : "FAIL";
})();
</script>
